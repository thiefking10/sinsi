<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>신시 — 협동 강하</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120c0e; --ink:#efe4cc; --dim:#a99b82; --gold:#e6b44a; --sinsu:#72d4ff;
  --curse:#5fa596; --maple:#c8342c; --blood:#c2413c; --panel:rgba(20,12,14,.84); --line:rgba(239,228,204,.18);
  box-sizing:border-box;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Gowun Dodum',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:inherit}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

#hud{position:fixed;top:8px;left:8px;width:min(42vw,320px);pointer-events:none}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#stName{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:17px;transition:color .4s}
#cVal{font-size:12px;color:var(--dim)}
.bar{position:relative;height:8px;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-top:4px}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#8a7058,var(--curse) 55%,var(--maple));transition:width .15s linear}
.sub{margin-top:6px;display:flex;align-items:center;gap:8px;font-size:12px}
.sub .bar{flex:1;height:7px;margin:0}
.sub>span:first-child{min-width:34px}
#hpFill{background:var(--blood)!important}
#xpFill{background:var(--gold)!important}
#oil{color:var(--sinsu);min-width:54px;text-align:right}
#lvTxt{color:var(--gold)}
#party{position:fixed;top:46px;right:8px;width:150px;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;pointer-events:none}
.pmem{margin:5px 0}
.pmem .pname{display:flex;justify-content:space-between;gap:6px}
.pmem .pname small{color:var(--dim);font-weight:400}
.pmem .pbar{position:relative;height:5px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden;margin-top:2px}
.pmem .pbar i{position:absolute;inset:0 auto 0 0;background:var(--blood)}
.pmem.down{opacity:.5}
#tr{position:fixed;top:8px;right:8px;display:flex;gap:6px}
.tog{font:inherit;font-size:12px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px 11px;cursor:pointer}
.tog[aria-pressed="true"]{color:var(--gold);border-color:rgba(230,180,74,.6)}

#boss{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(34vw,300px);display:none;pointer-events:none;text-align:center}
#boss span{font-family:'Nanum Myeongjo',serif;font-size:14px;color:#e4b878}
#boss .bar{height:10px}
#boss .bar i{background:#c48a3c}

#stick{position:fixed;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;
  border:2px solid var(--line);background:rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .12s}
#stick.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;background:rgba(239,228,204,.35);transform:translate(-50%,-50%)}

#btns{position:fixed;right:0;bottom:0;width:230px;height:230px;pointer-events:none}
.btn{position:absolute;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;pointer-events:auto;
  touch-action:none;overflow:hidden;cursor:pointer;padding:0}
.btn.down{transform:scale(.93);border-color:var(--gold)}
.btn small{font-size:11px;color:var(--dim);margin-top:2px}
#bAtk{width:88px;height:88px;right:22px;bottom:26px;font-size:17px;border-color:rgba(230,180,74,.55)}
#bSum{width:62px;height:62px;right:122px;bottom:18px;font-size:14px;color:#cfe9ff}
#bSal{width:62px;height:62px;right:116px;bottom:104px;font-size:14px;color:#f0a8a0}
#bPur{width:62px;height:62px;right:34px;bottom:128px;font-size:14px;color:var(--sinsu)}
.btn.off{opacity:.45}

#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-8px);
  width:min(56vw,440px);text-align:center;font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:15px;line-height:1.5;
  padding:9px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s;z-index:8}
#toast.show{opacity:1;transform:translate(-50%,0)}

#lvl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:6;background:rgba(10,6,7,.74);padding:16px}
#lvl.show{display:flex}
.lvbox{width:min(780px,100%)}
.lvbox h3{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:22px;margin:0 0 14px;text-align:center;color:var(--gold)}
#choices{display:flex;gap:12px}
.pick{flex:1;min-width:0;text-align:left;font:inherit;color:var(--ink);background:var(--panel);
  border:1px solid rgba(230,180,74,.4);border-radius:12px;padding:14px 16px;cursor:pointer}
.pick:active{border-color:var(--gold);transform:scale(.98)}
.pick h4{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:17px;margin:0 0 6px}
.pick p{margin:0;font-size:13px;line-height:1.55;color:#d9ccb2}
@media (orientation:portrait){#choices{flex-direction:column}}

#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse at 50% 35%,rgba(110,24,22,.45),rgba(10,6,7,.95) 70%);z-index:5}
#screen.hide{display:none}
.card{max-width:420px;width:100%;margin:auto;text-align:center}
.card h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(40px,10vmin,64px);line-height:1;margin:0;letter-spacing:-.02em}
.card h1 span{display:block;font-size:.3em;font-weight:700;color:var(--dim);letter-spacing:.08em;margin-top:10px}
.card p{font-size:15px;line-height:1.7;color:#d9ccb2;margin:14px 0}
.card input{width:100%;padding:12px;font:inherit;font-size:16px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;color:var(--ink);margin-bottom:10px;text-align:center}
.go{width:100%;padding:15px;font:inherit;font-size:17px;color:#1a0f0a;background:var(--gold);border:0;border-radius:10px;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:16px 0;font-size:14px;color:var(--dim)}
.stats b{display:block;font-size:22px;color:var(--ink);font-weight:400}
#connMsg{font-size:13px;color:var(--dim);margin-top:10px}

#inv{position:fixed;inset:0;display:none;z-index:6;background:rgba(10,6,7,.86);align-items:center;justify-content:center;padding:10px}
#inv.show{display:flex}
.invbox{width:min(880px,100%);max-height:100%;overflow-y:auto;display:grid;grid-template-columns:minmax(210px,1fr) 1.5fr;gap:16px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
@media (orientation:portrait){.invbox{grid-template-columns:1fr}}
.invbox h3{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:17px;margin:0 0 8px}
#slots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{font:inherit;text-align:left;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink);cursor:pointer;min-width:0}
.slot small{display:block;font-size:11px;color:var(--dim)}
.slot span{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.sel,.cell.sel{outline:2px solid var(--gold);outline-offset:1px}
#sumStats{margin-top:10px;font-size:12px;line-height:1.7;color:var(--dim)}
#sumStats .lg{color:#ff8a3a}
.invHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.invHead h3{margin:0}
#bagCt{font-size:13px;color:var(--dim)}
#bag{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cell{position:relative;height:46px;font:inherit;font-size:16px;background:rgba(0,0,0,.35);border:1.5px solid var(--line);border-radius:8px;color:var(--ink);cursor:pointer;padding:0}
.cell:disabled{opacity:.3;cursor:default}
.cell i{position:absolute;right:4px;top:2px;font-style:normal;font-size:11px;color:#7ee07e}
#detail{margin-top:10px;min-height:90px}
#detail h4{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:17px;margin:0}
#detail .meta{font-size:12px;color:var(--dim);margin:2px 0 6px}
#detail ul{list-style:none;padding:0;margin:0;font-size:13px;line-height:1.65}
#detail li.imp{color:var(--dim)}
#detail .leg{color:#ff8a3a;font-size:13px;margin:6px 0 0;line-height:1.5}
#detail .cmp{margin-top:6px;font-size:12px;line-height:1.6}
#detail .cmp small{display:block;color:var(--dim)}
.up{color:#7ee07e;margin-right:10px;display:inline-block}.down{color:#e07070;margin-right:10px;display:inline-block}
#detail .hint{font-size:13px;color:var(--dim);margin:0;line-height:1.6}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts .go{width:auto;padding:10px 18px;font-size:14px}
#clsPick{display:flex;flex-direction:column;gap:8px;margin:16px 0}
.clspick{text-align:left;font:inherit;color:var(--ink);background:rgba(0,0,0,.3);
  border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.clspick.sel{border-color:var(--gold);background:rgba(230,180,74,.12)}
.clspick b{display:block;font-family:'Nanum Myeongjo',serif;font-size:16px;color:var(--gold);margin-bottom:2px}
.clspick small{display:block;font-size:12px;color:var(--dim);line-height:1.5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="row"><span id="stName">평온</span><span id="cVal">저주 0</span></div>
  <div class="bar"><i id="cFill"></i></div>
  <div class="sub"><span>체력</span><div class="bar"><i id="hpFill"></i></div><span id="oil">신수 0</span></div>
  <div class="sub" id="furyRow" style="display:none"><span>분노</span><div class="bar"><i id="furyFill" style="background:#d96a4a"></i></div><span></span></div>
  <div class="sub" id="feroRow" style="display:none"><span id="feroLabel">야성</span><div class="bar"><i id="feroFill" style="background:#c9862e"></i></div><span></span></div>
  <div class="sub"><span id="lvTxt">Lv 1</span><div class="bar"><i id="xpFill"></i></div></div>
</div>
<div id="tr">
  <button class="tog" id="bInv">가방<em id="invBadge" style="font-style:normal;color:#7ee07e;margin-left:2px"></em></button>
  <button class="tog" id="bAuto" aria-pressed="false">자동 방울</button>
  <button class="tog" id="bSnd" aria-pressed="true">소리 켜짐</button>
</div>
<div id="inv">
  <div class="invbox">
    <div>
      <h3>장비</h3>
      <div id="slots"></div>
      <div id="sumStats"></div>
    </div>
    <div>
      <div class="invHead"><h3>가방 <span id="bagCt"></span></h3>
        <div><button class="tog" id="salvAll">일반, 마법 모두 분해</button> <button class="tog" id="invClose">닫기</button></div></div>
      <div id="bag"></div>
      <div id="detail"></div>
    </div>
  </div>
</div>
<div id="party"></div>
<div id="boss"><span>저주에 먹힌 형제, 동두</span><div class="bar"><i id="bossFill"></i></div></div>
<div id="downMsg" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:4;
  font-family:'Nanum Myeongjo',serif;font-size:20px;color:#e0625c;display:none;text-shadow:0 2px 6px #000">
  쓰러졌다<br>
  <span id="downSub" style="font-size:13px;color:var(--dim)">동료가 근처에 있다면 곧 다시 일어난다</span><br>
  <button id="rejoinBtn" class="go" style="display:none;margin-top:12px;width:auto;padding:10px 22px;font-size:14px">다시 합류하기</button>
</div>
<div id="stick"><div id="knob"></div></div>
<div id="btns">
  <button class="btn" id="bPur"><span>정화</span><small id="purCost">신수 4</small></button>
  <button class="btn" id="bSal"><span>살풀이</span></button>
  <button class="btn" id="bSum"><span>초혼</span><small id="soulCt">넋 0</small></button>
  <button class="btn" id="bAtk"><span>방울</span></button>
</div>
<div id="toast"></div>
<div id="lvl"><div class="lvbox"><h3 id="lvHead">신령이 속삭인다</h3><div id="choices"></div></div></div>
<div id="screen">
  <div class="card" id="card">
    <h1>신시<span>협동 강하</span></h1>
    <p>같은 와이파이의 무당들과 함께 저주를 막는다. 함께 싸우고, 함께 버틴다.</p>
    <div id="clsPick">
      <button class="clspick sel" id="clsMudang" data-cls="mudang">
        <b>무당</b><small>방울 원거리 공격, 원혼 소환. 저주를 낮게 눌러두며 싸운다.</small>
      </button>
      <button class="clspick" id="clsJeonsa" data-cls="jeonsa">
        <b>청동전사</b><small>근접 베기, 분노를 모아 돌진·광란. 저주가 높을수록 강해진다.</small>
      </button>
      <button class="clspick" id="clsBeomjok" data-cls="beomjok">
        <b>범족사냥꾼</b><small>평소엔 발톱을 던져 피를 흘리게 하고, 변신하면 빠르고 사나운 근접 맹수가 된다.</small>
      </button>
    </div>
    <input id="nameInput" maxlength="12" placeholder="이름 (무당1 등 기본값)">
    <button class="go" id="goBtn">강하 시작</button>
    <div id="connMsg"></div>
  </div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'), g=cv.getContext('2d');
let W=0,H=0;
function resize(){const d=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*d);cv.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();
addEventListener('contextmenu',e=>e.preventDefault());

if (location.protocol === 'file:') {
  document.body.innerHTML = `<div style="max-width:480px;margin:60px auto;padding:20px;background:#2a1830;border:2px solid #e8935a;border-radius:10px;font-size:15px;line-height:1.7">
    <b style="color:#e8935a">파일을 직접 연 것 같습니다.</b><br><br>
    주소창에 http:// 로 시작하는 서버 주소를 입력해서 접속하세요 (예: http://localhost:8765/ 또는 같은 와이파이의 PC 주소).</div>`;
  throw new Error('file:// — abort');
}

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const mix=(c1,c2,t)=>[lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)];
const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const PAL={earth:[72,58,48],earthHi:[98,80,64],curse:[32,60,56],curseHi:[52,94,84],maple:[88,20,22],mapleHi:[138,34,30]};
let WS_SIZE=1700, TS=68, TN=25;

/* ───────── 소리 ───────── */
let AC=null,master=null,noiseBuf=null,sfxOn=true;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
    const len=AC.sampleRate;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
addEventListener('pointerdown',()=>{if(AC&&AC.state==='suspended')AC.resume();});
const aOK=()=>AC&&sfxOn&&AC.state==='running';
function tone(f,dur,type,vol,delay,slide){
  if(!aOK())return;const t=AC.currentTime+Math.max(0,delay||0);
  const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(vol,t+.006);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gn);gn.connect(master);o.start(t);o.stop(t+dur+.03);
}
function noise(dur,vol,freq,delay,ft){
  if(!aOK())return;const t=AC.currentTime+Math.max(0,delay||0);
  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=ft||'lowpass';f.frequency.value=freq;
  const gn=AC.createGain();gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(gn);gn.connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.03);
}
const lastS={};
function thr(n,ms){const t=performance.now();if(lastS[n]&&t-lastS[n]<ms)return false;lastS[n]=t;return true;}
const SFX={
  bell(){if(!thr('bell',100))return;const b=2500+Math.random()*350;tone(b,.24,'sine',.05);tone(b*1.33,.2,'sine',.035);tone(b*1.87,.14,'sine',.02);},
  hit(){if(!thr('hit',40))return;noise(.05,.1,900);},
  crit(){if(!thr('crit',50))return;tone(1300,.09,'square',.03);noise(.07,.14,1800);},
  kill(){if(!thr('kill',35))return;tone(460,.13,'triangle',.07,0,110);},
  hurt(){tone(92,.2,'sawtooth',.11,0,55);noise(.12,.12,400);},
  summon(){[0,.07,.14].forEach((d,i)=>tone(620+i*240,.4,'sine',.06,d));noise(.45,.04,3000,0,'highpass');},
  sal(){noise(.38,.14,1100,0,'bandpass');tone(320,.32,'triangle',.06,0,170);},
  pur(){tone(520,.7,'sine',.07,0,780);tone(780,.7,'sine',.05,.06,1170);},
  lvl(){[1,1.26,1.5,2].forEach((m,i)=>tone(1500*m,.45,'sine',.06,i*.08));},
  boom(){if(!thr('boom',70))return;noise(.4,.22,480);tone(78,.4,'sine',.18,0,38);},
  gong(){tone(98,3.2,'sine',.24);tone(147,2.6,'sine',.1);tone(199,2.2,'sine',.06);noise(.25,.08,1800);},
  pick(){if(!thr('pick',55))return;tone(1500+Math.random()*500,.06,'sine',.025);},
  zap(){if(!thr('zap',60))return;noise(.12,.12,3000,0,'highpass');tone(1800,.1,'sawtooth',.03,0,600);},
  legend(){tone(98,2.6,'sine',.2);[1,1.25,1.5,2].forEach((m,i)=>tone(880*m,.6,'sine',.05,.1+i*.09));},
  rare(){[1,1.5].forEach((m,i)=>tone(1200*m,.3,'sine',.04,i*.07));},
  equip(){noise(.08,.1,1500);tone(600,.12,'triangle',.05);},
  slash(){if(!thr('slash',110))return;noise(.09,.13,2200,0,'bandpass');tone(180,.08,'sawtooth',.05,0,90);},
  dash(){if(!thr('dash',60))return;noise(.18,.1,2400,0,'bandpass');},
  frenzy(){tone(140,.5,'sawtooth',.1,0,60);noise(.3,.12,1500,0,'bandpass');},
  dart(){if(!thr('dart',90))return;noise(.06,.1,2600,0,'highpass');},
  claw(){if(!thr('claw',90))return;noise(.07,.12,1800,0,'bandpass');tone(220,.06,'sawtooth',.04);},
  transform(){tone(90,.6,'sawtooth',.14,0,220);noise(.4,.1,900,0,'bandpass');},
  pounce(){noise(.15,.14,1300,0,'bandpass');tone(160,.12,'square',.06,0,60);}
};

/* ───────── 상태 ───────── */

const BAG_MAX=12;

const AFF={
  bellDmg:{l:'방울 피해',u:'%',w:1},atkSpd:{l:'방울 속도',u:'%',w:1.5},spDmg:{l:'원혼 피해',u:'%',w:.9},spLife:{l:'원혼 지속',u:'초',w:2},
  hp:{l:'최대 체력',u:'',w:.6},crit:{l:'치명타 확률',u:'%',w:3},critDmg:{l:'치명타 피해',u:'%',w:.5},speed:{l:'이동 속도',u:'%',w:1.5},
  souls:{l:'넋 최대치',u:'',w:5},salCd:{l:'살풀이 대기 감소',u:'%',w:1},oil:{l:'신수 획득',u:'%',w:.4},regen:{l:'초당 체력 회복',u:'',w:8,dec:1},fanR:{l:'살풀이 범위',u:'%',w:.6}
};
const LEG_BY={thunder:{name:'천둥 방울',desc:'방울이 적중하면 20% 확률로 번개가 세 명에게 튄다'},soulbell:{name:'넋부름 방울',desc:'방울로 쓰러뜨린 적은 넋을 하나 더 남긴다'},
  maple:{name:'핏빛 단풍 부채',desc:'살풀이에 걸린 적은 저주가 끝날 때까지 불탄다'},wind:{name:'풍백의 부채',desc:'살풀이가 적을 멀리 날려 보내고, 대기 시간 −30%'},
  obang:{name:'오방신장 무복',desc:'피해를 받으면 원혼 둘이 곁에 나타난다 (3초마다)'},tiger:{name:'범가죽 무복',desc:'체력이 30% 이하일 때 모든 피해 +60%'},
  shackle:{name:'찢긴 족쇄',desc:'저주 걸린 적이 쓰러지면 터져 주변을 태운다'},brow:{name:'동두의 이마쇠',desc:'원혼 수가 절반이 되는 대신 거대해져 피해 +120%'}};
const fmtV=(k,v)=>AFF[k].dec?(Math.round(v*10)/10):Math.round(v);
const modText=m=>`${AFF[m.k].l} +${m.v}${AFF[m.k].u}`;
function itemScore(it){if(!it)return 0;let s=0;for(const m of it.mods)s+=m.v*AFF[m.k].w;return s+(it.leg?45:0);}
function sumMods(it){const o={};if(it)for(const m of it.mods)o[m.k]=(o[m.k]||0)+m.v;return o;}
let myInv={eq:{bell:null,fan:null,robe:null,trinket:null},bag:[],G:{},legends:0,oilTotal:0};
const isUpgrade=it=>itemScore(it)>itemScore(myInv.eq[it.slot])+.5;

let myId=null, tiles=[], state=null, running=false, ws=null, downSince=null;
const fx=[], txt=[], leaves=[];
let shake=0, flash=0, cam={x:WS_SIZE/2,y:WS_SIZE/2};
let toastTimer=0;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800);}
function addTxt(x,y,s,col,big){txt.push({x,y,s,col,big,t:0,life:big?.9:.7});}
function burstParticles(x,y,col,n,spd){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(spd||1)*(40+Math.random()*160);
  fx.push({type:'p',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:.35+Math.random()*.45,col,r:2+Math.random()*3});}}

function genTiles(seed,trans){
  const R=mulberry(seed); tiles=[];
  const ox=R()<.5?0:WS_SIZE, oy=R()<.5?0:WS_SIZE;
  for(let j=0;j<TN;j++)for(let i=0;i<TN;i++){
    const d=Math.hypot(i*TS+34-ox,j*TS+34-oy)/(WS_SIZE*1.414);
    tiles.push({n:R(),th:clamp(d*.85+R()*.22,0,1)});
  }
}

/* ───────── 네트워크 ───────── */
const wsUrl=`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}`;
let myCls='mudang', myTransformed=false;
function applyClassUI(){
  const jeonsa=myCls==='jeonsa', beomjok=myCls==='beomjok';
  $('furyRow').style.display=jeonsa?'flex':'none';
  $('feroRow').style.display=beomjok?'flex':'none';
  const soulCt=$('soulCt'); if(soulCt)soulCt.style.display=(jeonsa||beomjok)?'none':'block';
  if(jeonsa){
    $('bSum').querySelector('span').textContent='돌진';
    $('bSal').querySelector('span').textContent='광란';
    $('bAtk').querySelector('span').textContent='베기';
  }else if(beomjok){
    $('bSum').querySelector('span').textContent='변신';
    $('bSal').querySelector('span').textContent='도약';
    $('bAtk').querySelector('span').textContent=myTransformed?'발톱':'사냥';
  }else{
    $('bSum').querySelector('span').textContent='초혼';
    $('bSal').querySelector('span').textContent='살풀이';
    $('bAtk').querySelector('span').textContent='방울';
  }
}
function sendName(){
  if(!ws||ws.readyState!==1)return;
  const nm=$('nameInput').value.trim();
  ws.send(JSON.stringify({type:'name',name:nm,cls:myCls}));
}
function connect(){
  $('connMsg').textContent='서버에 접속 중...';
  ws=new WebSocket(wsUrl);
  ws.onopen=()=>{$('connMsg').textContent='접속됨';};
  ws.onclose=()=>{$('connMsg').textContent='연결이 끊겼습니다. 재접속 중...';setTimeout(connect,2000);};
  ws.onerror=()=>{};
  ws.onmessage=ev=>{
    const m=JSON.parse(ev.data);
    if(m.type==='welcome'){
      myId=m.id;WS_SIZE=m.world.w;TS=m.world.ts;TN=m.world.tn;genTiles(m.seed,m.trans);downSince=null;
    }else if(m.type==='classConfirm'){
      myCls=m.cls;applyClassUI();
    }else if(m.type==='state'){
      state=m;
      for(const e of m.events)handleEvent(e);
    }else if(m.type==='levelup'){
      showLevelUp(m);
    }else if(m.type==='levelup_done'){
      $('lvl').classList.remove('show');
    }else if(m.type==='inventory'){
      myInv={eq:m.eq,bag:m.bag,G:m.G,legends:m.legends,oilTotal:m.oilTotal};
      if($('inv').classList.contains('show'))renderInv();
    }else if(m.type==='full'){
      $('connMsg').textContent='서버가 가득 찼습니다.';
    }
  };
}
function handleEvent(e){
  if(e.type==='hit'){SFX[e.crit?'crit':'hit']();addTxt(e.x,e.y-e.r,e.crit?e.amt+'!':e.amt,e.crit?'#ffd35a':(e.curse?'#f0a8a0':'#efe4cc'),e.crit);}
  else if(e.type==='kill'){SFX.kill();burstParticles(e.x,e.y,ET[e.etype]?ET[e.etype].col:'#fff',e.boss?70:12,e.etype==='ghoul'?1:1.3);fx.push({type:'pop',x:e.x,y:e.y,r:ET[e.etype]?ET[e.etype].r:14,t:0,life:.25});}
  else if(e.type==='bell'){SFX.bell();}
  else if(e.type==='hurt'){if(e.id===myId){SFX.hurt();shake=Math.max(shake,.4);}addTxt(e.x,e.y-24,'-'+e.amt,'#e0625c',true);}
  else if(e.type==='down'){if(e.id===myId){toast('쓰러졌다');downSince=performance.now();}}
  else if(e.type==='rejoin'){if(e.id===myId)downSince=null;fx.push({type:'ring',x:e.x,y:e.y,t:0,life:.5,max:70,col:'230,180,74',thin:true});}
  else if(e.type==='summon'){SFX.summon();fx.push({type:'ring',x:e.x,y:e.y,t:0,life:.5,max:90,col:'114,212,255',thin:true});}
  else if(e.type==='sal'){SFX.sal();shake=Math.max(shake,.25);fx.push({type:'fan',x:e.x,y:e.y,t:0,life:.55,r:e.r});}
  else if(e.type==='pur'){SFX.pur();fx.push({type:'ring',x:e.x,y:e.y,t:0,life:.9,max:700,col:'114,212,255',thin:true});addTxt(e.x,e.y-30,'저주 −18','#72d4ff',true);}
  else if(e.type==='boom'){SFX.boom();shake=Math.max(shake,.45);fx.push({type:'ring',x:e.x,y:e.y,t:0,life:.35,max:e.r,col:'240,150,60'});}
  else if(e.type==='gong'){SFX.gong();shake=1;flash=.7;}
  else if(e.type==='stage'){toast(e.msg);SFX.gong();shake=.8;}
  else if(e.type==='transform'){shake=1.3;flash=1;SFX.gong();SFX.boom();genTiles(state? (Math.random()*1e9)|0 : 0,true);toast('구역이 저주에 삼켜졌다. 되돌릴 수 없다. 대신 신수가 두 배로 흐른다');}
  else if(e.type==='bossSpawn'){toast('저주에 먹힌 형제, 동두가 깨어났다');shake=.8;SFX.gong();}
  else if(e.type==='shockwave'){fx.push({type:'shock',x:e.x,y:e.y,t:0,life:1.5,max:360});}
  else if(e.type==='zap'){SFX.zap();}
  else if(e.type==='bolt'){fx.push({type:'bolt',x1:e.x1,y1:e.y1,x2:e.x2,y2:e.y2,t:0,life:.2});}
  else if(e.type==='legend'){SFX.legend();if(e.id===undefined||e.id===myId)toast('전설이 떨어졌다 — '+e.name);}
  else if(e.type==='rare'){SFX.rare();}
  else if(e.type==='pick'){if(e.id===myId){SFX.pick();addTxt(e.x,e.y-36,e.name,e.color,e.big);}}
  else if(e.type==='bagFull'){if(e.id===myId)toast('가방이 가득 찼다. 가방에서 분해하세요');}
  else if(e.type==='slash'){SFX.slash();fx.push({type:'swipe',x:e.x,y:e.y,face:e.face,r:e.r,arc:e.arc,t:0,life:.16});}
  else if(e.type==='charge'){SFX.dash();fx.push({type:'swipe',x:e.x,y:e.y,face:e.face,r:70,arc:.5,t:0,life:.2});}
  else if(e.type==='frenzy'){SFX.frenzy();shake=Math.max(shake,.3);fx.push({type:'ring',x:e.x,y:e.y,t:0,life:.5,max:95,col:'217,106,74',thin:true});}
  else if(e.type==='dart'){SFX.dart();}
  else if(e.type==='claw'){SFX.claw();fx.push({type:'swipe',x:e.x,y:e.y,face:e.face,r:62,arc:.55,t:0,life:.13});}
  else if(e.type==='beastform'){SFX.transform();shake=Math.max(shake,.35);fx.push({type:'ring',x:e.x,y:e.y,t:0,life:.5,max:80,col:'201,134,46',thin:false});}
  else if(e.type==='detransform'){fx.push({type:'ring',x:e.x,y:e.y,t:0,life:.35,max:60,col:'201,134,46',thin:true});}
  else if(e.type==='pounce'){SFX.pounce();fx.push({type:'swipe',x:e.x,y:e.y,face:e.face,r:90,arc:.7,t:0,life:.18});}
}

/* ───────── 입력 ───────── */
const inp={x:0,y:0,atk:false};const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyK')doAction('sum');if(e.code==='KeyU')doAction('sal');if(e.code==='KeyL')doAction('pur');});
addEventListener('keyup',e=>{keys[e.code]=false});
const stick=$('stick'),knob=$('knob');let sid=null,sx=0,sy=0;
cv.addEventListener('pointerdown',e=>{if(sid!==null)return;sid=e.pointerId;sx=e.clientX;sy=e.clientY;
  stick.style.left=sx+'px';stick.style.top=sy+'px';knob.style.transform='translate(-50%,-50%)';stick.classList.add('on');
  try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==sid)return;let dx=e.clientX-sx,dy=e.clientY-sy;const m=Math.hypot(dx,dy),R=48;
  if(m>R){dx*=R/m;dy*=R/m}inp.x=dx/R;inp.y=dy/R;knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;});
const endStick=e=>{if(e.pointerId!==sid)return;sid=null;inp.x=inp.y=0;stick.classList.remove('on')};
cv.addEventListener('pointerup',endStick);cv.addEventListener('pointercancel',endStick);
function hold(el,on,off){
  el.addEventListener('pointerdown',e=>{e.preventDefault();on();el.classList.add('down')});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,()=>{off&&off();el.classList.remove('down')}));
}
hold($('bAtk'),()=>inp.atk=true,()=>inp.atk=false);
function doAction(which){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'action',which}));}
$('bSum').addEventListener('pointerdown',e=>{e.preventDefault();doAction('sum');});
$('bSal').addEventListener('pointerdown',e=>{e.preventDefault();doAction('sal');});
$('bPur').addEventListener('pointerdown',e=>{e.preventDefault();doAction('pur');});

let autoFire=false;
$('bAuto').addEventListener('click',()=>{autoFire=!autoFire;$('bAuto').setAttribute('aria-pressed',autoFire);});
$('rejoinBtn').addEventListener('click',()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'rejoin'}));});
$('bSnd').addEventListener('click',()=>{sfxOn=!sfxOn;$('bSnd').setAttribute('aria-pressed',sfxOn);$('bSnd').textContent=sfxOn?'소리 켜짐':'소리 꺼짐';});

setInterval(()=>{
  if(!ws||ws.readyState!==1)return;
  let mx=inp.x,my=inp.y;
  if(keys.KeyW||keys.ArrowUp)my=-1;if(keys.KeyS||keys.ArrowDown)my=1;if(keys.KeyA||keys.ArrowLeft)mx=-1;if(keys.KeyD||keys.ArrowRight)mx=1;
  let atk=inp.atk||keys.KeyJ||keys.Space;
  if(!atk&&autoFire&&state){
    const me=state.players.find(p=>p.id===myId);
    if(me&&me.alive)atk=state.en.some(e=>Math.hypot(e.x-me.x,e.y-me.y)<400);
  }
  ws.send(JSON.stringify({type:'input',dx:mx,dy:my,atk}));
},50);

/* ───────── 가방 ───────── */
let invSel=null;
function openInv(){invSel=null;renderInv();$('inv').classList.add('show');}
function closeInv(){$('inv').classList.remove('show');}
function selItem(){if(!invSel)return null;return invSel.from==='bag'?myInv.bag[invSel.i]:myInv.eq[invSel.slot];}
function renderInv(){
  const sl=$('slots');sl.innerHTML='';
  for(const k of SLOT_KEYS){const it=myInv.eq[k];const b=document.createElement('button');
    b.className='slot'+(invSel&&invSel.from==='eq'&&invSel.slot===k?' sel':'');
    b.innerHTML=`<small>${SLOT_NAME[k]}</small><span style="color:${it?RAR[it.r].c:'var(--dim)'}">${it?it.name:'비어 있음'}</span>`;
    b.onclick=()=>{invSel=it?{from:'eq',slot:k}:null;renderInv();};sl.appendChild(b);}
  const G=myInv.G;let st='';
  for(const k in AFF)if(G[k])st+=`<div>${AFF[k].l} +${fmtV(k,G[k])}${AFF[k].u}</div>`;
  for(const id of Object.keys(LEG_BY))if(myInv.eq.bell&&myInv.eq.bell.leg===id||myInv.eq.fan&&myInv.eq.fan.leg===id||myInv.eq.robe&&myInv.eq.robe.leg===id||myInv.eq.trinket&&myInv.eq.trinket.leg===id)
    st+=`<div class="lg">${LEG_BY[id].name}: ${LEG_BY[id].desc}</div>`;
  $('sumStats').innerHTML=st||'<div>장비 효과 없음</div>';
  const bg=$('bag');bg.innerHTML='';
  for(let i=0;i<BAG_MAX;i++){const it=myInv.bag[i];const c=document.createElement('button');
    c.className='cell'+(invSel&&invSel.from==='bag'&&invSel.i===i?' sel':'');
    if(it){c.style.borderColor=RAR[it.r].c;
      c.innerHTML=`<span style="color:${RAR[it.r].c}">${SLOT_NAME[it.slot][0]}</span>${isUpgrade(it)?'<i>▲</i>':''}`;
      c.onclick=()=>{invSel={from:'bag',i};renderInv();};}
    else c.disabled=true;
    bg.appendChild(c);}
  $('bagCt').textContent=myInv.bag.length+' / '+BAG_MAX;
  const ups=myInv.bag.filter(isUpgrade).length;$('invBadge').textContent=ups?' ▲'+ups:'';
  const d=$('detail'),it=selItem();
  if(!it){d.innerHTML='<p class="hint">아이템을 누르면 자세히 볼 수 있어요. 초록 ▲는 지금 장착한 것보다 좋은 장비입니다.</p>';return;}
  const cur=invSel.from==='bag'?myInv.eq[it.slot]:null;
  let h=`<h4 style="color:${RAR[it.r].c}">${it.name}</h4><div class="meta">${RAR[it.r].n} ${SLOT_NAME[it.slot]}, ${it.base}</div><ul>`;
  for(const m of it.mods)h+=`<li${m.imp?' class="imp"':''}>${modText(m)}</li>`;
  h+='</ul>';
  if(it.leg)h+=`<p class="leg">${LEG_BY[it.leg].desc}</p>`;
  if(invSel.from==='bag'){
    const a=sumMods(it),b=sumMods(cur);let dl='';
    for(const k in AFF){const df=(a[k]||0)-(b[k]||0);if(Math.abs(df)<.05)continue;
      dl+=`<span class="${df>0?'up':'down'}">${AFF[k].l} ${df>0?'+':'−'}${fmtV(k,Math.abs(df))}${AFF[k].u}</span>`;}
    if(cur&&cur.leg&&cur.leg!==it.leg)dl+=`<span class="down">${LEG_BY[cur.leg].name} 효과를 잃음</span>`;
    h+=`<div class="cmp"><small>${cur?'지금 장착한 '+cur.name+'과 비교':'이 칸은 비어 있어요'}</small>${dl}</div>`;
  }
  h+='<div class="acts">'+(invSel.from==='bag'?'<button class="go" id="actEquip">장착</button>':'<button class="go ghost" id="actUnequip">해제</button>')+
    `<button class="go ghost" id="actSalv">분해 (신수 +${RAR[it.r].salv})</button></div>`;
  d.innerHTML=h;
  if($('actEquip'))$('actEquip').onclick=()=>{ws.send(JSON.stringify({type:'equip',i:invSel.i}));SFX.equip();invSel=null;};
  if($('actUnequip'))$('actUnequip').onclick=()=>{if(myInv.bag.length>=BAG_MAX){toast('가방이 가득 찼다');return;}ws.send(JSON.stringify({type:'unequip',slot:invSel.slot}));invSel=null;};
  $('actSalv').onclick=()=>{ws.send(JSON.stringify({type:'salvage',from:invSel.from,i:invSel.i,slot:invSel.slot}));SFX.pick();invSel=null;};
}

function drawObs(o){
  const r=o.r;if(r<1)return;
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(o.x+4,o.y+r*.35,r*1.05,r*.55,0,0,6.28);g.fill();
  if(o.kind==='bone'){
    g.strokeStyle='#cdbf9f';g.lineWidth=Math.max(2,r*.16);g.lineCap='round';
    for(let k=0;k<3;k++){const yy=o.y-r*.55+k*r*.5;
      for(const s of [-1,1]){g.beginPath();g.moveTo(o.x+s*r*.08,yy);g.quadraticCurveTo(o.x+s*r*.85,yy+r*.1,o.x+s*r*.62,yy+r*.4);g.stroke();}}
    g.fillStyle='#483a30';g.beginPath();g.ellipse(o.x,o.y+r*.05,r*.16,r*.95,0,0,6.28);g.fill();
    g.fillStyle='#cdbf9f';g.beginPath();g.ellipse(o.x,o.y+r*.05,r*.12,r*.9,0,0,6.28);g.fill();
    g.fillStyle='#e6dbc2';g.beginPath();g.ellipse(o.x-r*.05,o.y-r*.75,r*.16,r*.24,0,0,6.28);g.fill();
  }else if(o.kind==='bronze'){
    const sp=[[0,1],[.5,.72],[-.52,.76],[.16,.46],[-.24,.42]];
    for(const [dx,s] of sp){const bx=o.x+dx*r*.72, h=r*s;
      g.fillStyle='#5a3a1c';g.beginPath();g.moveTo(bx-r*.24*s,o.y+h*.5);g.lineTo(bx,o.y-h*.85);g.lineTo(bx+r*.24*s,o.y+h*.5);g.closePath();g.fill();
      g.fillStyle='#b07a3a';g.beginPath();g.moveTo(bx-r*.13*s,o.y+h*.4);g.lineTo(bx,o.y-h*.8);g.lineTo(bx+r*.04*s,o.y+h*.05);g.closePath();g.fill();}
    g.fillStyle='#c48a3c';g.beginPath();g.ellipse(o.x,o.y-r*.7,r*.08,r*.15,0,0,6.28);g.fill();
  }else{
    g.fillStyle='#3a1a14';g.fillRect(o.x-r*.13,o.y-r*.15,r*.26,r*.95);
    g.fillStyle='#8a2220';g.beginPath();g.arc(o.x,o.y-r*.42,r*1.0,0,6.28);g.fill();
    g.fillStyle='#c8342c';for(let k=0;k<5;k++){const a=k/5*6.28+.3;g.beginPath();g.ellipse(o.x+Math.cos(a)*r*.42,o.y-r*.5+Math.sin(a)*r*.36,r*.36,r*.22,a,0,6.28);g.fill();}
    g.fillStyle='#e0553c';g.beginPath();g.ellipse(o.x-r*.28,o.y-r*.78,r*.26,r*.17,-.4,0,6.28);g.fill();
  }
}
function drawEnemy(e){
  if(e.type==='charger'&&e.state==='aim'){
    const k=1-Math.max(0,e.st)/.62;g.strokeStyle=`rgba(230,80,60,${.25+k*.55})`;g.lineWidth=4+k*10;g.setLineDash([10,8]);
    g.beginPath();g.moveTo(e.x,e.y);g.lineTo(e.x+e.dx*240,e.y+e.dy*240);g.stroke();g.setLineDash([]);
  }
  const c=e.flash?'#ffffff':ET[e.type].col, r=e.r;
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(e.x,e.y+r*.7,r,r*.4,0,0,6.28);g.fill();
  g.fillStyle=c;
  if(e.type==='ghoul'){
    g.globalAlpha=.88;g.beginPath();g.arc(e.x,e.y-2,r*.92,Math.PI,0);
    for(let k=0;k<=6;k++){const jag=(k%2?1:-1)*2.6;g.lineTo(e.x+r*.92-k*r*.92*2/6,e.y+r*.7+jag+Math.sin(e.wob+k)*2.5);}
    g.closePath();g.fill();g.globalAlpha=1;
    g.fillStyle='#120c0e';g.beginPath();g.ellipse(e.x-3.6,e.y-4,2,2.8,0,0,6.28);g.ellipse(e.x+3.6,e.y-4,2,2.8,0,0,6.28);g.fill();
  }else if(e.type==='charger'){
    const a=e.state==='chase'?Math.atan2((e.ty||e.y)-e.y,(e.tx||e.x)-e.x):Math.atan2(e.dy,e.dx);
    g.beginPath();g.moveTo(e.x+Math.cos(a)*r*1.5,e.y+Math.sin(a)*r*1.5);
    g.lineTo(e.x+Math.cos(a+2.4)*r,e.y+Math.sin(a+2.4)*r);g.lineTo(e.x+Math.cos(a-2.4)*r,e.y+Math.sin(a-2.4)*r);g.closePath();g.fill();
    g.strokeStyle='#241a16';g.lineWidth=2.2;g.lineCap='round';
    for(const s of [-1,1]){g.beginPath();g.moveTo(e.x+Math.cos(a+2.0*s)*r*.55,e.y+Math.sin(a+2.0*s)*r*.55);
      g.lineTo(e.x+Math.cos(a+.85*s)*r*1.55,e.y+Math.sin(a+.85*s)*r*1.55);g.stroke();}
    g.fillStyle='#3a120c';g.beginPath();g.arc(e.x+Math.cos(a)*r*.4,e.y+Math.sin(a)*r*.4,3,0,6.28);g.fill();
  }else if(e.type==='spitter'){
    const bob=Math.sin(e.wob)*3;g.beginPath();g.arc(e.x,e.y+bob,r,0,6.28);g.fill();
    const glow=e.charge>0?e.charge/.45:0;
    g.fillStyle='#2a1030';g.beginPath();g.ellipse(e.x,e.y+bob+2,r*.5,r*.36+glow*2.2,0,0,6.28);g.fill();
    g.fillStyle=`rgba(220,160,255,${.5+glow*.5})`;g.beginPath();g.arc(e.x,e.y+bob+2,3+glow*5,0,6.28);g.fill();
  }else if(e.type==='mutant'){
    g.beginPath();for(let k=0;k<12;k++){const a=k/12*6.28+e.wob*.2,rr=k%2?r*.6:r*1.4;g.lineTo(e.x+Math.cos(a)*rr,e.y+Math.sin(a)*rr);}
    g.closePath();g.fill();g.fillStyle='#16302a';g.beginPath();g.arc(e.x,e.y,r*.32,0,6.28);g.fill();
  }else if(e.type==='bomber'){
    const f=e.fuse>0?1-e.fuse/.7:0;const rr0=r*(1+f*.45)+Math.sin(e.wob*1.5)*1.5;
    g.fillStyle=e.fuse>0&&Math.floor(e.fuse*14)%2?'#ffe0a0':c;
    g.beginPath();for(let k=0;k<8;k++){const a=k/8*6.28,rr=rr0*(1+Math.sin(k*2.7+e.wob*.3)*.08);g.lineTo(e.x+Math.cos(a)*rr,e.y+Math.sin(a)*rr);}
    g.closePath();g.fill();
    g.strokeStyle=`rgba(120,40,30,${.6+f*.3})`;g.lineWidth=2;
    for(let k=0;k<4;k++){const a=k*1.57+.4;g.beginPath();g.moveTo(e.x,e.y);g.quadraticCurveTo(e.x+Math.cos(a+.5)*rr0*.5,e.y+Math.sin(a+.5)*rr0*.5,e.x+Math.cos(a)*rr0*.9,e.y+Math.sin(a)*rr0*.9);g.stroke();}
  }else if(e.type==='husk'){
    g.beginPath();g.roundRect?g.roundRect(e.x-r,e.y-r*.6,r*2,r*1.7,6):g.rect(e.x-r,e.y-r*.6,r*2,r*1.7);g.fill();
    g.fillStyle='#5a5f66';g.beginPath();g.arc(e.x,e.y-r*.5,r*.92,Math.PI,0);g.fill();
    g.fillRect(e.x-r*.98,e.y-r*.55,r*1.96,r*.32);
    g.fillStyle='#120c0e';g.fillRect(e.x-r*.72,e.y-r*.38,r*1.44,r*.22);
    g.fillStyle='#f0c24a';g.fillRect(e.x-r*.5,e.y-r*.32,r*.3,r*.14);g.fillRect(e.x+r*.2,e.y-r*.32,r*.3,r*.14);
  }else{
    const pr=r+Math.sin(state.t*3)*3;
    g.beginPath();g.arc(e.x,e.y,pr,0,6.28);g.fill();
    g.fillStyle=e.flash?'#fff':'#5a5f66';g.beginPath();g.arc(e.x,e.y-pr*.25,pr*.72,Math.PI,0);g.fill();
    g.fillStyle=e.flash?'#fff':'#3a2414';
    g.beginPath();g.moveTo(e.x-pr*.7,e.y-pr*.5);g.lineTo(e.x-pr*1.15,e.y-pr*1.35);g.lineTo(e.x-pr*.3,e.y-pr*.82);g.fill();
    g.beginPath();g.moveTo(e.x+pr*.7,e.y-pr*.5);g.lineTo(e.x+pr*1.15,e.y-pr*1.35);g.lineTo(e.x+pr*.3,e.y-pr*.82);g.fill();
    g.fillStyle='#e0553c';g.beginPath();g.arc(e.x-pr*.28,e.y,5,0,6.28);g.arc(e.x+pr*.28,e.y,5,0,6.28);g.fill();
  }
  if(e.curse){g.strokeStyle='rgba(240,120,110,.8)';g.lineWidth=2;g.setLineDash([4,4]);g.beginPath();g.arc(e.x,e.y,r+6,0,6.28);g.stroke();g.setLineDash([]);}
  if(e.bleed){g.fillStyle='rgba(194,65,58,.85)';for(let k=0;k<3;k++){const a=k*2.1+e.wob;g.beginPath();g.arc(e.x+Math.cos(a)*(r+4),e.y+Math.sin(a)*(r+4),1.6,0,6.28);g.fill();}}
  if(e.type!=='boss'&&e.hp<e.max&&e.hp>0){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(e.x-r,e.y-r-9,r*2,4);
    g.fillStyle='#c2413c';g.fillRect(e.x-r,e.y-r-9,r*2*Math.max(0,e.hp/e.max),4);}
}
function drawSpirit(s){
  const fade=Math.min(1,(s.life-s.t)/2);const r=9;const fl=Math.sin(state.t*8+s.idx)*2;
  g.globalAlpha=.35*fade;g.fillStyle='#9fdcff';g.beginPath();g.arc(s.x,s.y,r*2,0,6.28);g.fill();
  g.globalAlpha=.9*fade;g.fillStyle='#dff4ff';
  g.beginPath();g.moveTo(s.x,s.y-r*1.8-fl);g.quadraticCurveTo(s.x+r,s.y-r*.2,s.x,s.y+r);g.quadraticCurveTo(s.x-r,s.y-r*.2,s.x,s.y-r*1.8-fl);g.fill();
  g.globalAlpha=1;
}
function drawPlayer(p){
  if(!p.alive)return;
  if(p.invFlicker&&Math.floor(state.t*30)%2)return;
  const bob=Math.sin(state.t*6)*1,sw=Math.sin(state.t*4.3)*2.4,fx2=p.x,fy=p.y+bob,fa=p.face;
  g.fillStyle=p.color+'22';g.beginPath();g.arc(fx2,fy,36,0,6.28);g.fill();
  g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.ellipse(p.x,p.y+13,13,5,0,0,6.28);g.fill();
  if(p.cls==='jeonsa')drawJeonsa(p,fx2,fy,fa,sw);
  else if(p.cls==='beomjok')drawBeomjok(p,fx2,fy,fa,sw);
  else drawMudang(p,fx2,fy,fa,sw);
  g.fillStyle=p.id===myId?'#e6b44a':'#efe4cc';g.font='12px "Gowun Dodum", sans-serif';g.textAlign='center';
  g.fillText(p.name,fx2,fy-34);
  if(p.hp<p.max){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(fx2-16,fy-31,32,4);g.fillStyle='#c2413c';g.fillRect(fx2-16,fy-31,32*Math.max(0,p.hp/p.max),4);}
}
function drawMudang(p,fx2,fy,fa,sw){
  g.fillStyle='#d9ccae';g.beginPath();g.ellipse(fx2-Math.cos(fa)*4-9,fy-1-Math.sin(fa)*2+sw*.3,7.5,11,-.35,0,6.28);g.fill();
  g.fillStyle='#efe4cc';
  g.beginPath();g.moveTo(fx2-6.5,fy-9);g.quadraticCurveTo(fx2-12.5,fy+6,fx2-9.5,fy+13);
  g.lineTo(fx2+9.5,fy+13);g.quadraticCurveTo(fx2+12.5,fy+6,fx2+6.5,fy-9);g.closePath();g.fill();
  g.fillStyle=p.color;
  g.beginPath();g.moveTo(fx2,fy-8);g.lineTo(fx2-5.5,fy+11);g.lineTo(fx2-1.8,fy+11);g.lineTo(fx2,fy-1);
  g.lineTo(fx2+1.8,fy+11);g.lineTo(fx2+5.5,fy+11);g.closePath();g.fill();
  g.fillStyle='#efe4cc';
  g.beginPath();g.ellipse(fx2+Math.cos(fa)*9,fy+Math.sin(fa)*5+2+sw*.4,7,10,fa,0,6.28);g.fill();
  g.fillStyle='#f4ecdc';g.beginPath();g.arc(fx2,fy-15,7,0,6.28);g.fill();
  g.fillStyle='#241a16';g.beginPath();g.ellipse(fx2,fy-19,8.8,2.3,0,0,6.28);g.fill();
  g.beginPath();g.moveTo(fx2-4.2,fy-19);g.lineTo(fx2,fy-28);g.lineTo(fx2+4.2,fy-19);g.closePath();g.fill();
  const bx=fx2+Math.cos(fa)*18,by=fy+Math.sin(fa)*18-2;
  g.fillStyle='#e6b44a';g.beginPath();g.arc(bx,by,4,0,6.28);g.fill();
}
function drawJeonsa(p,fx2,fy,fa,sw){
  // 청동전사: 떡 벌어진 어깨, 청동 갑주, 손에 비파형 동검
  g.fillStyle='#5a4028';g.beginPath();g.ellipse(fx2,fy+2,12,13,0,0,6.28);g.fill();
  g.fillStyle='#b07a3a';
  g.beginPath();g.moveTo(fx2-11,fy-6);g.lineTo(fx2+11,fy-6);g.lineTo(fx2+9,fy+13);g.lineTo(fx2-9,fy+13);g.closePath();g.fill();
  g.fillStyle='#c48a3c';
  for(let k=0;k<3;k++)g.fillRect(fx2-9+k*6.2,fy-3,4.4,13);
  g.fillStyle=p.color;g.beginPath();g.ellipse(fx2,fy-2,4,6,0,0,6.28);g.fill();
  g.fillStyle='#8a6a3a';
  g.beginPath();g.ellipse(fx2-Math.cos(fa)*5,fy-3+sw*.2,5,7,fa,0,6.28);g.fill();
  g.beginPath();g.ellipse(fx2+Math.cos(fa)*10,fy-2+Math.sin(fa)*4,5.5,8,fa,0,6.28);g.fill();
  const sx=fx2+Math.cos(fa)*20,sy=fy+Math.sin(fa)*20-3;
  g.strokeStyle='#d8b878';g.lineWidth=3;g.lineCap='round';
  g.beginPath();g.moveTo(fx2+Math.cos(fa)*12,fy+Math.sin(fa)*12-3);g.lineTo(sx,sy);g.stroke();
  g.fillStyle='#f4ecdc';g.beginPath();g.arc(fx2,fy-15,7.5,0,6.28);g.fill();
  g.fillStyle='#3a2414';g.beginPath();g.arc(fx2,fy-16,7.8,Math.PI*1.15,Math.PI*1.95);g.fill();
  g.fillStyle='#c48a3c';g.beginPath();g.moveTo(fx2-3,fy-22);g.lineTo(fx2-6,fy-28);g.lineTo(fx2-1,fy-24);g.closePath();g.fill();
  g.beginPath();g.moveTo(fx2+3,fy-22);g.lineTo(fx2+6,fy-28);g.lineTo(fx2+1,fy-24);g.closePath();g.fill();
}
function drawBeomjok(p,fx2,fy,fa,sw){
  if(p.transformed) drawBeomjokTiger(p,fx2,fy,fa,sw); else drawBeomjokHunter(p,fx2,fy,fa,sw);
}
function drawBeomjokHunter(p,fx2,fy,fa,sw){
  // 사냥꾼(인간형): 가죽·모피를 두른 호리호리한 몸, 손에 짧은 사냥칼
  g.fillStyle='#6a5238';
  g.beginPath();g.moveTo(fx2-7,fy-8);g.quadraticCurveTo(fx2-10,fy+5,fx2-7,fy+13);
  g.lineTo(fx2+7,fy+13);g.quadraticCurveTo(fx2+10,fy+5,fx2+7,fy-8);g.closePath();g.fill();
  g.fillStyle='#8a6a44';
  g.beginPath();g.ellipse(fx2-Math.cos(fa)*4,fy-2+sw*.3,5,8,-fa,0,6.28);g.fill();
  g.fillStyle=p.color;
  for(let k=0;k<3;k++){g.beginPath();g.arc(fx2-5+k*5,fy+10,1.6,0,6.28);g.fill();}
  g.fillStyle='#8a6a44';
  g.beginPath();g.ellipse(fx2+Math.cos(fa)*8,fy+Math.sin(fa)*4,5,8,fa,0,6.28);g.fill();
  const kx=fx2+Math.cos(fa)*15,ky=fy+Math.sin(fa)*15-1;
  g.strokeStyle='#e8dfc8';g.lineWidth=2.5;g.lineCap='round';
  g.beginPath();g.moveTo(fx2+Math.cos(fa)*10,fy+Math.sin(fa)*10-1);g.lineTo(kx,ky);g.stroke();
  g.fillStyle='#c9a876';g.beginPath();g.arc(fx2,fy-14,6.5,0,6.28);g.fill();
  g.fillStyle='#4a3420';g.beginPath();g.ellipse(fx2,fy-17,7,4,0,Math.PI,0);g.fill();
  g.fillStyle='#3a2818';
  g.beginPath();g.moveTo(fx2-4,fy-19);g.lineTo(fx2-7,fy-14);g.lineTo(fx2-3,fy-16);g.closePath();g.fill();
  g.beginPath();g.moveTo(fx2+4,fy-19);g.lineTo(fx2+7,fy-14);g.lineTo(fx2+3,fy-16);g.closePath();g.fill();
}
function drawBeomjokTiger(p,fx2,fy,fa,sw){
  // 변신(호랑이형): 저자세로 웅크린 네발짐승, 줄무늬
  const bl=17,bw=9;
  g.save();g.translate(fx2,fy);g.rotate(fa);
  g.beginPath();g.moveTo(-bl*.8,0);g.quadraticCurveTo(-bl*1.5,bw*.8+sw,-bl*1.9,0);g.strokeStyle='#3a2414';g.lineWidth=4;g.lineCap='round';g.stroke();
  g.fillStyle='#241a10';
  for(const dx of [-bl*.5,0,bl*.4]){g.beginPath();g.ellipse(dx,bw*.85,3,4,0,0,6.28);g.fill();g.beginPath();g.ellipse(dx,-bw*.85,3,4,0,0,6.28);g.fill();}
  g.fillStyle='#c9862e';
  g.beginPath();g.ellipse(0,0,bl,bw,0,0,6.28);g.fill();
  g.fillStyle='#241a10';g.lineWidth=2.6;g.strokeStyle='#241a10';
  for(let k=-2;k<=2;k++){g.beginPath();g.moveTo(k*bl*.28,-bw*.85);g.lineTo(k*bl*.28+3,bw*.85);g.stroke();}
  g.fillStyle='#e8dfc8';g.beginPath();g.ellipse(bl*.55,0,bw*.55,bw*.62,0,0,6.28);g.fill();
  g.fillStyle='#c9862e';g.beginPath();g.arc(bl*.95,0,bw*.62,0,6.28);g.fill();
  g.fillStyle='#241a10';
  g.beginPath();g.moveTo(bl*.72,-bw*.55);g.lineTo(bl*.6,-bw*1.05);g.lineTo(bl*.92,-bw*.62);g.closePath();g.fill();
  g.beginPath();g.moveTo(bl*.72,bw*.55);g.lineTo(bl*.6,bw*1.05);g.lineTo(bl*.92,bw*.62);g.closePath();g.fill();
  g.fillStyle='#ffd35a';g.beginPath();g.arc(bl*1.1,-bw*.22,1.6,0,6.28);g.arc(bl*1.1,bw*.22,1.6,0,6.28);g.fill();
  g.restore();
}
function updFx(dt){
  for(const f of fx){f.t+=dt;if(f.type==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.9;f.vy*=.9;}}
  for(let i=fx.length-1;i>=0;i--)if(fx[i].t>=fx[i].life)fx.splice(i,1);
  for(const t of txt){t.t+=dt;t.y-=(t.big?42:30)*dt;}
  for(let i=txt.length-1;i>=0;i--)if(txt[i].t>=txt[i].life)txt.splice(i,1);
  if(state&&state.trans&&leaves.length<60&&Math.random()<dt*14)
    leaves.push({x:Math.random()*W,y:-10,vy:30+Math.random()*40,sw:Math.random()*6.28,r:3+Math.random()*3,rot:Math.random()*6.28});
  for(const l of leaves)l.y+=l.vy*dt,l.sw+=dt*2,l.rot+=dt*1.5;
  for(let i=leaves.length-1;i>=0;i--)if(leaves[i].y>H+20)leaves.splice(i,1);
  shake=Math.max(0,shake-dt*1.6);flash=Math.max(0,flash-dt*1.2);
}
function render(dt){
  g.fillStyle='#0d080a';g.fillRect(0,0,W,H);
  if(!state){return;}
  const me=state.players.find(p=>p.id===myId);
  const focus=me||{x:WS_SIZE/2,y:WS_SIZE/2};
  cam.x=lerp(cam.x,focus.x,.12);cam.y=lerp(cam.y,focus.y,.12);
  const cxw=W>WS_SIZE?WS_SIZE/2:clamp(cam.x,W/2,WS_SIZE-W/2), cyw=H>WS_SIZE?WS_SIZE/2:clamp(cam.y,H/2,WS_SIZE-H/2);
  const sh=shake*9;
  const ox=Math.round(cxw-W/2+(Math.random()-.5)*sh), oy=Math.round(cyw-H/2+(Math.random()-.5)*sh);
  g.save();g.translate(-ox,-oy);

  const i0=Math.max(0,Math.floor(ox/TS)),i1=Math.min(TN-1,Math.floor((ox+W)/TS));
  const j0=Math.max(0,Math.floor(oy/TS)),j1=Math.min(TN-1,Math.floor((oy+H)/TS));
  const cf=state.c/100;
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){
    const t=tiles[j*TN+i];if(!t)continue;let col,f=0;const tx=i*TS,ty=j*TS;
    if(state.trans){col=mix(PAL.maple,PAL.mapleHi,t.n*.7);}
    else{f=clamp((cf-t.th)*5,0,1);col=mix(mix(PAL.earth,PAL.earthHi,t.n*.6),mix(PAL.curse,PAL.curseHi,t.n*.6),f);}
    g.fillStyle=rgb(col);g.fillRect(tx,ty,TS+1,TS+1);
    if(!state.trans){
      g.fillStyle=f>.55?'rgba(32,60,56,.4)':'rgba(72,58,48,.4)';
      g.beginPath();g.arc(tx+9+t.n*14,ty+50-t.th*12,1.8,0,6.28);g.fill();
    }
  }
  g.strokeStyle='rgba(239,228,204,.25)';g.lineWidth=3;g.strokeRect(0,0,WS_SIZE,WS_SIZE);

  for(const d of state.drops){
    if(d.kind==='oil'){g.fillStyle='rgba(114,212,255,.25)';g.beginPath();g.arc(d.x,d.y,9,0,6.28);g.fill();
      g.fillStyle='#72d4ff';g.beginPath();g.moveTo(d.x,d.y-7);g.quadraticCurveTo(d.x+5,d.y,d.x,d.y+4);g.quadraticCurveTo(d.x-5,d.y,d.x,d.y-7);g.fill();}
    else{g.fillStyle='#8fd08a';g.fillRect(d.x-2,d.y-7,4,14);g.fillRect(d.x-7,d.y-2,14,4);}
  }
  for(const l of state.loot){const bob=Math.sin((state.t+l.x)*3)*2;
    if(l.r>=2){const gr=g.createLinearGradient(l.x,l.y-90,l.x,l.y);gr.addColorStop(0,'rgba(0,0,0,0)');
      gr.addColorStop(1,l.r===3?'rgba(255,138,58,.6)':'rgba(240,210,90,.45)');g.fillStyle=gr;g.fillRect(l.x-5,l.y-90,10,90);}
    g.fillStyle=l.col;g.beginPath();g.moveTo(l.x,l.y-9+bob);g.lineTo(l.x+7,l.y+bob);g.lineTo(l.x,l.y+9+bob);g.lineTo(l.x-7,l.y+bob);g.closePath();g.fill();
    g.font='12px "Gowun Dodum", sans-serif';g.textAlign='center';g.fillStyle=l.col;g.fillText(l.name,l.x,l.y-14+bob);}

  const drawables=[...state.obs.map(o=>({y:o.y,f:()=>drawObs(o)})),...state.en.map(e=>({y:e.y,f:()=>drawEnemy(e)})),...state.sp.map(s=>({y:s.y,f:()=>drawSpirit(s)}))];
  for(const p of state.players)drawables.push({y:p.y,f:()=>drawPlayer(p)});
  drawables.sort((a,b)=>a.y-b.y).forEach(d=>d.f());

  for(const q of state.eproj){g.fillStyle='rgba(180,110,230,.35)';g.beginPath();g.arc(q.x,q.y,q.r*2,0,6.28);g.fill();
    g.fillStyle='#d8a8ff';g.beginPath();g.arc(q.x,q.y,q.r,0,6.28);g.fill();}
  for(const pr of state.proj){const a=Math.atan2(pr.vy,pr.vx);
    g.strokeStyle='rgba(230,180,74,.8)';g.lineWidth=3;
    for(let w=0;w<3;w++){g.beginPath();g.arc(pr.x-Math.cos(a)*w*7,pr.y-Math.sin(a)*w*7,7+w*3,a-.9,a+.9);g.stroke();}}

  for(const f of fx){const k=f.t/f.life;
    if(f.type==='ring'){g.strokeStyle=`rgba(${f.col},${(1-k)*.9})`;g.lineWidth=f.thin?3:12*(1-k)+2;g.beginPath();g.arc(f.x,f.y,f.max*k,0,6.28);g.stroke();}
    else if(f.type==='fan'){for(let b=0;b<8;b++){const a=b/8*6.28+k*2;g.fillStyle=`rgba(240,130,120,${(1-k)*.35})`;
      g.beginPath();g.moveTo(f.x,f.y);g.arc(f.x,f.y,f.r*Math.min(1,k*1.6),a,a+.45);g.closePath();g.fill();}}
    else if(f.type==='shock'){g.strokeStyle=`rgba(196,138,60,${(1-k)*.9})`;g.lineWidth=10;g.beginPath();g.arc(f.x,f.y,f.max*k,0,6.28);g.stroke();}
    else if(f.type==='pop'){g.strokeStyle=`rgba(255,255,255,${(1-k)*.9})`;g.lineWidth=3*(1-k)+1;g.beginPath();g.arc(f.x,f.y,f.r*(1+k*1.4),0,6.28);g.stroke();}
    else if(f.type==='swipe'){g.strokeStyle=`rgba(230,210,180,${(1-k)*.85})`;g.lineWidth=6*(1-k)+2;
      g.beginPath();g.arc(f.x,f.y,f.r*(0.4+k*.6),f.face-f.arc/2,f.face+f.arc/2);g.stroke();}
    else if(f.type==='p'){g.fillStyle=f.col;g.globalAlpha=1-k;g.beginPath();g.arc(f.x,f.y,f.r,0,6.28);g.fill();g.globalAlpha=1;}}
  g.textAlign='center';
  for(const t of txt){g.globalAlpha=1-t.t/t.life;g.fillStyle=t.col;
    g.font=t.big?'bold 20px "Gowun Dodum", sans-serif':'14px "Gowun Dodum", sans-serif';
    if(t.big){g.strokeStyle='rgba(0,0,0,.6)';g.lineWidth=3;g.strokeText(t.s,t.x,t.y);}g.fillText(t.s,t.x,t.y);}
  g.globalAlpha=1;
  g.restore();

  for(const l of leaves){g.save();g.translate(l.x+Math.sin(l.sw)*14,l.y);g.rotate(l.rot);g.fillStyle='rgba(200,52,44,.85)';
    g.beginPath();g.ellipse(0,0,l.r*1.6,l.r,0,0,6.28);g.fill();g.restore();}

  const px=focus.x-ox,py=focus.y-oy,dark=.5+Math.min(cf,1)*.3;
  const vg=g.createRadialGradient(px,py,120,px,py,Math.max(W,H)*.72);
  vg.addColorStop(0,'rgba(8,4,6,0)');vg.addColorStop(1,`rgba(8,4,6,${dark})`);g.fillStyle=vg;g.fillRect(0,0,W,H);
  if(me&&me.alive&&me.hp/me.max<.3){const a=(.3-me.hp/me.max)*1.4*(.6+.4*Math.sin(state.t*6));
    const hv=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.7);
    hv.addColorStop(0,'rgba(160,20,20,0)');hv.addColorStop(1,`rgba(160,20,20,${a})`);g.fillStyle=hv;g.fillRect(0,0,W,H);}
  if(flash>0){g.fillStyle=`rgba(220,70,50,${flash*.45})`;g.fillRect(0,0,W,H);}
}

/* ───────── HUD ───────── */
function updHud(){
  if(!state)return;
  const me=state.players.find(p=>p.id===myId);
  $('cFill').style.width=state.c+'%';
  $('stName').textContent=STAGE_NAME[state.stage];$('stName').style.color=STAGE_COL[state.stage];
  $('cVal').textContent=state.trans?'되돌릴 수 없음':'저주 '+Math.floor(state.c);
  if(me){
    // running(강하 시작 이후)에만 서버 값으로 동기화 — 그 전엔 아직 확정 안 된 내 선택을 서버의 기본값(무당)이 매 프레임 덮어써버림
    if(running&&me.cls!==myCls){myCls=me.cls;applyClassUI();}
    $('hpFill').style.width=(me.hp/me.max*100)+'%';
    $('xpFill').style.width=(me.xp/me.xpNeed*100)+'%';
    $('lvTxt').textContent='Lv '+me.lv;
    $('oil').textContent='신수 '+me.oil;
    if(me.cls==='jeonsa'){
      $('furyFill').style.width=(me.fury/me.maxFury*100)+'%';
      $('bSum').classList.toggle('off',false);
    }else if(me.cls==='beomjok'){
      $('feroFill').style.width=(me.ferocity/me.maxFerocity*100)+'%';
      $('feroLabel').textContent=me.transformed?'야성 (변신 중)':'야성';
      $('bSum').classList.toggle('off',false);
      if(me.transformed!==myTransformed){myTransformed=me.transformed;applyClassUI();}
    }else{
      $('soulCt').textContent='넋 '+me.souls+'/'+me.maxSouls;
      $('bSum').classList.toggle('off',me.souls<=0);
    }
  }
  const CLS_LABEL={mudang:'무당 ',jeonsa:'전사 ',beomjok:'사냥꾼 '};
  $('party').innerHTML=state.players.map(p=>`
    <div class="pmem${p.alive?'':' down'}">
      <div class="pname"><span style="color:${p.color}">${p.id===myId?'★ ':''}${p.name}</span><small>${p.alive?(CLS_LABEL[p.cls]||'')+'Lv'+p.lv:'쓰러짐'}</small></div>
      <div class="pbar"><i style="width:${Math.max(0,p.hp/p.max*100)}%"></i></div>
    </div>`).join('');
  const downed=me&&!me.alive&&running&&!state.over;
  $('downMsg').style.display=downed?'block':'none';
  if(downed){
    const ready=downSince&&performance.now()-downSince>2000;
    $('rejoinBtn').style.display=ready?'inline-block':'none';
    $('downSub').textContent=ready?'주변이 잠잠해졌다면 다시 합류할 수 있다':'잠시 기다린다...';
  }
  const b=$('boss');if(state.boss){b.style.display='block';$('bossFill').style.width=Math.max(0,state.boss.hp/state.boss.max*100)+'%';}else b.style.display='none';

  if(state.over&&running){
    running=false;
    $('card').innerHTML=`<h2>${state.over==='won'?'형제를 풀어주었다':'무당들이 쓰러졌다'}</h2>
      <p>${state.over==='won'?'저주에 먹혔던 동두가 제 이름을 되찾았다.':'저주는 기다려 주지 않는다.'}</p>
      <div class="stats"><div>버틴 시간<b>${Math.floor(state.t/60)}분 ${Math.floor(state.t%60)}초</b></div><div>처치<b>${me?me.kills:0}</b></div></div>
      <button class="go" id="restartBtn">다시 강하</button>`;
    $('screen').classList.remove('hide');
    $('restartBtn').onclick=()=>{ws.send(JSON.stringify({type:'restart'}));$('screen').classList.add('hide');running=true;};
  }
}

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  updFx(dt);render(dt);updHud();requestAnimationFrame(loop);}

for(const el of document.querySelectorAll('.clspick')){
  el.addEventListener('click',()=>{
    myCls=el.dataset.cls;
    document.querySelectorAll('.clspick').forEach(b=>b.classList.toggle('sel',b===el));
    applyClassUI();
  });
}
$('goBtn').addEventListener('click',()=>{initAudio();sendName();if(state&&state.over)ws.send(JSON.stringify({type:'restart'}));$('screen').classList.add('hide');running=true;});
connect();
requestAnimationFrame(loop);
})();
</script>
