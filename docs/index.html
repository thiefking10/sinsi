<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>신시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#120c0e;--ink:#efe4cc;--dim:#a99b82;--gold:#e6b44a;--panel:rgba(20,12,14,.84);--line:rgba(239,228,204,.18)}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
    font-family:'Gowun Dodum',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(ellipse at 50% 35%,rgba(110,24,22,.35),rgba(10,6,7,.97) 70%)}
  .card{max-width:420px;width:100%;text-align:center}
  h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(44px,11vmin,72px);line-height:1;margin:0;letter-spacing:-.02em}
  h1 span{display:block;font-size:.28em;font-weight:700;color:var(--dim);letter-spacing:.08em;margin-top:10px}
  p{font-size:15px;line-height:1.7;color:#d9ccb2;margin:18px 0 28px}
  .opt{display:block;width:100%;text-align:left;padding:18px 20px;margin-bottom:14px;border-radius:12px;
    background:var(--panel);border:1px solid rgba(230,180,74,.4);color:var(--ink);text-decoration:none;cursor:pointer}
  .opt:active{border-color:var(--gold);transform:scale(.99)}
  .opt b{display:block;font-family:'Nanum Myeongjo',serif;font-size:19px;color:var(--gold);margin-bottom:4px}
  .opt small{display:block;font-size:13px;color:var(--dim);line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <h1>신시<span>神市, 그리고 神屍</span></h1>
  <p>찢긴 전쟁신 치우의 몸 위에 세운 도시. 어떻게 강하할지 골라주세요.</p>
  <a class="opt" href="sinsi-mudang-v5.html">
    <b>혼자 하기</b>
    <small>서버가 필요 없어요. 이 폰/PC 하나만으로 바로 시작합니다. 언제든, 와이파이 없이도 가능.</small>
  </a>
  <a class="opt" href="mp-game.html">
    <b>같이 하기 (협동)</b>
    <small>다른 사람이 같은 주소로 이 페이지를 열면 함께 싸웁니다.</small>
  </a>
</div>
</body>
</html>
